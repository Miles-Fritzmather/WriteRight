name: Palimpsest
options:
  bundleIdPrefix: com.milesfritzmather
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

targets:
  Palimpsest:
    type: application
    platform: iOS
    sources:
      - path: Palimpsest
    resources:
      - path: Palimpsest/Resources
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Palimpsest/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Automatic
        NSPhotoLibraryAddUsageDescription: "Palimpsest can export finished pages to your photo library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milesfritzmather.palimpsest
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
schemes:
  Palimpsest:
    build:
      targets:
        Palimpsest: all
    run:
      config: Debug
    test:
      config: Debug
